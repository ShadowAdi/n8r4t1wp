services:
  backend:
    build:
      context: ./backend
    environment:
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      API_UPSTREAM: http://backend:8000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
